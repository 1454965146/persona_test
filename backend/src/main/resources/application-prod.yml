spring:
  datasource:
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

auth:
  dev-login-enabled: false

wechat:
  mock-enabled: false

server:
  tomcat:
    accesslog:
      enabled: true
